[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hedweb"
dynamic = ["version"]
description = "Web interface, REST services, and Docker deployment for HED tools."
readme = "README.md"
authors = [
    { name = "VisLab" },
    { name = "Ian Callanan" },
    { name = "Jeremy Cockfield" },
    { name = "Kay Robbins", email = "Kay.Robbins@utsa.edu" }
]
license = { text = "MIT License" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "Flask>=3.1.1",
    "Flask-WTF>=1.2.2",
    "config>=0.5.1",
    # 1.2.0 is the first release with the schema-version manifest fast path:
    # get_available_hed_versions() and single-version downloads resolve from schema_versions.json
    # on the raw/CDN host instead of the metered GitHub REST API, so hed-server needs no GitHub token.
    "hedtools>=1.2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3,<4.0.0",
    "Werkzeug>=3.1.3",
    "requests>=2.32.4",
    "table-remodeler>=0.3.0"
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.1.0,<10.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=3.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "linkify-it-py>=2.0.3"
]
dev = [
    "ruff>=0.8.0",
    "coverage>=7.0.0",
    "typos>=1.29.0",
    "mdformat==0.7.22",
    "mdformat-myst>=0.1.5",
]
prod = [
    "gunicorn>=23.0.0"
]

[project.scripts]
hedweb = "hedweb.runserver:main"

[project.urls]
Homepage = "https://www.hedtags.org"
Documentation = "https://www.hedtags.org/hed-server"
Repository = "https://github.com/hed-standard/hed-server.git"
Issues = "https://github.com/hed-standard/hed-server/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hedweb*"]

[tool.setuptools.package-data]
hedweb = ["templates/*", "static/**/*", "constants/*"]

[tool.setuptools_scm]
write_to = "hedweb/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "hedweb/_version.py",  # Auto-generated by setuptools-scm
    ".status",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# __init__.py files: unused imports are re-exports, and their import order is
# curated by hand to avoid circular imports - isort must not reorder them.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["hedweb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.typos.files]
extend-exclude = [
    "hedweb/static/",
    "docs/_build/",
    "docs/_static/",
    "service_tests/data/",
    "*.xml",
    "*.tsv",
    "*.json",
    "*.map",
    "*.min.css",
    "*.mediawiki",
    "*.omn",
    "*.pdf",
    "*.svg",
]

[tool.typos.default.extend-words]
# Domain-specific terms that are not misspellings
hed = "hed"
parms = "parms"
covert = "covert"
recuse = "recuse"
disjointness = "disjointness"
assertIn = "assertIn"

[tool.pytest.ini_options]
testpaths = ["tests", "service_tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Separate markers for different test types
markers = [
    "unit: Unit tests that don't require external services",
    "service: Service tests that require a running HED web server",
]
