name: Test service routes (development)

permissions:
  contents: read

# Todo: May want to tweak what branches this runs on
on:
  push:
    branches: ["*"]
  pull_request:
    branches: [ "*" ]

# Pushing a commit to a branch that has an open PR fires BOTH the push event
# above and the pull_request "synchronize" event for that same commit - the
# pull_request "branches" filter matches the PR's target branch, not its
# source branch, so it always matches here regardless of which branch was
# pushed to. That means every such push starts two full runs of this
# workflow building and deploying the exact same commit to the same fixed
# host port (33004), which can race and fail with "address already in use".
#
# Group on the actual commit (github.event.pull_request.head.sha for the
# pull_request event, github.sha for the push event - both equal the SHA
# that was actually pushed) so the two duplicate runs land in the same
# concurrency group; the one that starts second cancels the first instead
# of racing it for the port.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  # Which hed-server branch deploy.sh clones and builds the Docker image from.
  #
  # - Pull request from a fork: use github.base_ref (the target branch, i.e.
  #   'main'). Forks are untrusted, so we deliberately do NOT build whatever
  #   Dockerfile/deploy.sh a fork PR supplies with this repo's CI credentials.
  # - Pull request from a branch on this repo (not a fork): use
  #   github.head_ref (the PR's own branch). These are trusted, and this is
  #   the only way to actually validate a PR that changes deploy.sh and/or
  #   the Dockerfile together - building 'main' instead would silently test
  #   the OLD deploy scripts against the PR's checked-out code, which breaks
  #   whenever the two change in incompatible ways.
  # - Direct push (no PR): use github.ref_name, the branch that was pushed.
  BRANCH_NAME: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork && github.base_ref || github.head_ref)) || github.ref_name }}


jobs:
  build:
    env:
      HED_SERVER_URL: "http://127.0.0.1:33004/hed_dev"
    strategy:
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Make the script files executable
        run: chmod +x deploy/deploy.sh

      - name: Run deploy script (develop)
        run: |
          cd deploy
          bash ./deploy.sh "$BRANCH_NAME" dev
          echo "\nVerifying container is running..."
          if ! docker ps | grep -q hedtools_dev; then
            echo "ERROR: Container hedtools_dev is not running!"
            echo "\nContainer status:"
            docker ps -a | grep hedtools_dev || echo "Container not found"
            echo "\nContainer logs:"
            docker logs hedtools_dev 2>&1 || echo "Could not get logs"
            exit 1
          fi
          echo "Container hedtools_dev is running successfully"

      - name: Show deploy status
        if: always()
        run: |
          echo "Checking Docker containers..."
          docker ps -a
          echo "Checking Docker images..."
          docker images

      - name: Debug container startup (on failure)
        if: failure()
        run: |
          echo "=== Attempting direct Python import to capture startup traceback ==="
          docker run --rm \
            -e HEDTOOLS_CONFIG_CLASS=config.ProductionConfig \
            -e HED_URL_PREFIX=/hed_dev \
            -e HED_STATIC_URL_PATH=/hed_dev/hedweb/static \
            hedtools_dev:latest \
            python -c "from hedweb.runserver import app; print('App loaded OK')" \
            || true
          echo "=== End of startup debug ==="

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to start..."
          sleep 5
          echo "Checking if container is running..."
          if ! docker ps | grep -q hedtools_dev; then
            echo "Container not running! Checking if it exited..."
            docker ps -a | grep hedtools_dev || echo "Container not found at all"
            echo "Container logs:"
            docker logs hedtools_dev 2>&1 || true
            exit 1
          fi
          echo "Testing server health with retries..."
          for i in {1..30}; do
            if curl --silent --fail --location --max-time 5 ${{ env.HED_SERVER_URL }}; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/30 failed, waiting 5 seconds..."
            if ! docker ps | grep -q hedtools_dev; then
              echo "Container stopped during wait! Logs:"
              docker logs hedtools_dev 2>&1 || true
              exit 1
            fi
            sleep 5
          done
          echo "Server did not become ready in time"
          docker logs hedtools_dev
          exit 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Dev tests track hed-python's main branch to match the dev container
          # (deploy.sh dev builds with HED_INSTALL_SOURCE=git-main). Pin @main
          # explicitly so this never silently follows a changed default branch.
          pip install --upgrade git+https://github.com/hed-standard/hed-python.git@main
          pip install -e .

      - name: Run service tests
        env:
          HED_SERVER_URL_KEY: ${{ env.HED_SERVER_URL }}
        run: python -m unittest discover service_tests

      - name: Show Docker logs
        if: always()
        run: |
          echo "Displaying Docker logs..."
          docker logs hedtools_dev 2>&1 || echo "No logs available (container may not exist)"
