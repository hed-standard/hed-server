# Codecov configuration for hed-server
# Documentation: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        # Project coverage can drop by up to 2% and still pass
        target: auto
        threshold: 2%
        informational: false
    patch:
      default:
        # New code should be reasonably well-tested
        target: 70%
        threshold: 5%
        informational: false

# Comment configuration
comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Ignore paths that don't need coverage
# Aligned with .coveragerc configuration
ignore:
  - "tests/**/*"
  - "service_tests/**/*"
  - "docs/**/*"
  - "deploy/**/*"
  # Versioneer-generated files (using patterns from .coveragerc)
  - "versioneer.py"
  - "*/versioneer.py"
  - "*/_version.py"
  - "**/_version.py"
  - "hedweb/_version.py"
  # Static and template files
  - "*/static/*"
  - "*/templates/*"
  - "**/static/**/*"
  - "**/templates/**/*"
  # Init files (as per .coveragerc)
  - "**/__init__.py"
  - "*/__init__.py"
